<svg xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="300" height="400" viewBox="0 0 300 400"
    preserveAspectRatio="none">

        <descdesc>
            The Code by Kurt Cagle from "SVG Programming: The Graphical Web" book
            Apress 2002
        </descdesc>

    <defs>

        <linearGradient id="signGrad" gradientTransform="rotate(45)">
            <stop offset="0%" stop-color="white" stop-opacity="0"/>
            <stop offset="100%" stop-color="black" stop-opacity=".4"/>
        </linearGradient>

        <radialGradient id="boltGrad" gradientTranform="translate(-0.2, -0.2)">
            <stop offset="0%" stop-color="#C0C0C0"/>
            <stop offset="70%" stop-color="#808080"/>
            <stop offset="100%" stop-color="white"/>
        </radialGradient>

        <linearGradient id="steel">
            <stop offset="0%" stop-color="#C0C0C0"/>
            <stop offset="20%" stop-color="#404040"/>
            <stop offset="30%" stop-color="#FFFFFF"/>
            <stop offset="60%" stop-color="#808080"/>
            <stop offset="65%" stop-color="#202020"/>
            <stop offset="75%" stop-color="#C0C0C0"/>
            <stop offset="100%" stop-color="#8080"/>
        </linearGradient>

        <linearGradient id="steelShadow" gradientTransform="rotate(90)">
            <stop offset="0%" stop-color="black" stop-opacity="1"/>
            <stop offset="40%" stop-color="black" stop-opacity="1"/>
            <stop offset="42%" stop-color="black" stop-opacity="0"/>
            <stop offset="100%" stop-color="black" stop-opacity="0"/>
        </linearGradient>

        <filter id="Turb5" filterUnits="objectBoundingBox"
            x="0%" y="0%" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="4"/>
        </filter>

       <!--  <image xlink:href="ForbiddingTrimmed.jpg" x="0" y="0" width="300" height="400" fill="black" id="background"/> -->
       <path id="signShape" d="m0,-100 l40,0 l60,60 l0,80 l-60,60 l-80,0 l-60,-60 l0,-80 l60,-60z"/>
       <mask maskUnit="objectBoundingBox" id="signMask">
            x="0%" y="0%" width="100%" height="100%"
            <use xlink:href="#signShape" x="0" y="0" width="100%" height="100%" fill="white"/>
        </mask>

        <circle cx="0" cy="0" r="4" fill="url(#boltGrad)" id="bolt"/>

        <g transform="translate(150,150)" id="sign">

            <rect x="-10" y="0" width="20" height="250" fill="url(#steel)" id="pole"/>
            <rect x="-10" y="0" width="20" height="250" fill="url(#steelShadow)" id="pole"/>
            <use xlink:href="#signShape" x="0" y="0" fill="white" id="signWhite"/>
            <use xlink:href="#signShape" x="0" y="0" tranform="scale(0.95)" id="signInner"/>
            <text x="0" y="0" font-size="72" font-family="Arial Narrow" fill="white" text-anchor="middle" dominant-baseline="mathematical">
                STOP
            </text>
            <use xlink:href="#signShape" x="0%" y="0%" filter="url(#Turb5)" id="signShade" mask="url(#signMask)" opacity="0.4"/>
            <use xlink:href="#signShape" x="0%" y="0%" fill="url(#signGrad)" id="signShade" mask="url(#signMask)"/>
            <use xlink:href="#bolt" x="0" y="-80" />
            <use xlink:href="#bolt" x="0" y="80" />
        </g>
   </defs>
        <use xlink:href="#background" x="0" y="0" />
        <use xlink:href="#background" x="0" y="0" fill="red" />
</svg>
