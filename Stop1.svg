<svg xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="300" height="400" viewBox="0 0 300 400"
    preserveAspectRatio="none">

        <descdesc>
            The Code by Kurt Cagle from "SVG Programming: The Graphical Web" book
            Apress 2002
        </descdesc>

        <rect x="0" y="0" width="300" height="400" fill="black" id="background"/>
        <g transform="translate(150,150)">
             <rect x="-10" y="0" width="20" height="250" fill="gray" id="pole"/>
             <path id="signShape" d="m0,-100 l40,0 l60,60 l0,80 l-60,60 l-80,0 l-60,-60 l0,-80 l60,-60z"/>
             <use xlink:href="#signShape" x="0" y="0" fill="white" id="signWhite" />
             <use xlink:href="#signShape" x="0" y="0" fill="red" transform="scale(0.95)" id="signRed" />
             <text x="0" y="0"
                 font-size="72"
                 font-family="Arial Narrow"
                 fill="white"
                 text-anchor="middle"
                 dominant-baseline="mathematical">
                 STOP
             </text>
        </g>
    </svg>
